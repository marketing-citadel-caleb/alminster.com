name: Character sync (off)

# Off until Blizzard publishes the profile API for WoW: Forever.
# The site never depends on this. To switch it on, see "Blizzard
# character sync" in the README, then uncomment the schedule below.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "43 */6 * * *"

jobs:
  sync:
    if: vars.CHARACTER_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Read character details from the Blizzard API
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLIZZARD_REGION: ${{ vars.BLIZZARD_REGION }}
          BLIZZARD_PROFILE_NAMESPACE: ${{ vars.BLIZZARD_PROFILE_NAMESPACE }}
        run: python3 scripts/sync_characters.py

      - name: Save changes and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync character details from Blizzard"
            git pull --rebase --quiet
            git push
            # Pushes made by this workflow do not trigger other workflows, so start the deploy directly.
            gh workflow run site.yml
          fi
